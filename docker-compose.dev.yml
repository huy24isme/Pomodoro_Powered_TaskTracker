services:
  pomodoro-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pomodoro-frontend-dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://pomodoro-backend-dev:5000
    ports:
      - "3005:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      pomodoro-backend:
        condition: service_healthy
    networks:
      - pomodoro-dev-network

  pomodoro-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pomodoro-backend-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5005:5000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      pomodoro-mongodb:
        condition: service_healthy
      pomodoro-redis:
        condition: service_healthy
    networks:
      - pomodoro-dev-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pomodoro-mongodb:
    image: mongo:7.0.5
    container_name: pomodoro-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-pomodoro-tracker}
    ports:
      - "27019:27017"
    volumes:
      - mongodb_dev_data:/data/db
      - mongodb_dev_config:/data/configdb
    networks:
      - pomodoro-dev-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pomodoro-redis:
    image: redis:7-alpine
    container_name: pomodoro-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6381:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - pomodoro-dev-network
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_dev_data:
  mongodb_dev_config:
  redis_dev_data:

networks:
  pomodoro-dev-network:
    driver: bridge
